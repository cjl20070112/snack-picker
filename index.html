<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>零食小铺</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  background: #fdf2f6;
  padding-bottom: 100px;
}

.top-nav {
  background: linear-gradient(135deg, #ff8fb3, #ffa8c5);
  color: #fff;
  padding: 20px;
  text-align: center;
  box-shadow: 0 2px 10px rgba(255, 107, 157, 0.2);
}
.top-nav h1 { font-size: 22px; font-weight: bold; }
.top-nav p { font-size: 13px; opacity: 0.9; margin-top: 4px; }

.categories {
  background: #fff;
  padding: 14px 15px;
  display: flex;
  overflow-x: auto;
  gap: 10px;
  position: sticky;
  top: 0;
  z-index: 10;
  box-shadow: 0 1px 5px rgba(0,0,0,0.03);
}
.categories::-webkit-scrollbar { display: none; }
.cat-tab {
  padding: 7px 16px;
  border-radius: 20px;
  background: #fdf0f5;
  font-size: 13px;
  color: #888;
  white-space: nowrap;
  cursor: pointer;
  transition: all 0.2s;
}
.cat-tab.active {
  background: linear-gradient(135deg, #ff6b9d, #ff8fb3);
  color: #fff;
  box-shadow: 0 3px 10px rgba(255, 107, 157, 0.3);
}

.snack-list { padding: 14px; }
.snack-item {
  background: #fff;
  border-radius: 16px;
  padding: 16px;
  margin-bottom: 12px;
  display: flex;
  align-items: center;
  box-shadow: 0 2px 8px rgba(255, 107, 157, 0.06);
  transition: transform 0.15s;
}
.snack-item:active { transform: scale(0.98); }
.snack-emoji {
  width: 60px;
  height: 60px;
  background: #fff0f5;
  border-radius: 14px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 30px;
  margin-right: 14px;
  flex-shrink: 0;
}
.snack-info { flex: 1; }
.snack-name { font-size: 15px; font-weight: bold; color: #333; margin-bottom: 4px; }
.snack-desc { font-size: 11px; color: #aaa; margin-bottom: 8px; }
.snack-price { color: #ff4081; font-weight: bold; font-size: 16px; }

.snack-actions {
  display: flex;
  align-items: center;
  gap: 8px;
}
.plus-btn, .minus-btn {
  width: 32px;
  height: 32px;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 18px;
  font-weight: bold;
  cursor: pointer;
  transition: all 0.15s;
}
.plus-btn { background: linear-gradient(135deg, #ff6b9d, #ff8fb3); color: #fff; box-shadow: 0 3px 8px rgba(255, 107, 157, 0.3); }
.plus-btn:active { transform: scale(0.9); }
.minus-btn { background: #fff; color: #ff6b9d; border: 2px solid #ffd0dd; }
.minus-btn:active { transform: scale(0.9); }
.count { font-size: 15px; font-weight: bold; min-width: 18px; text-align: center; }

.bottom-bar {
  position: fixed;
  bottom: 0;
  left: 0; right: 0;
  height: 65px;
  background: #fff;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 18px;
  box-shadow: 0 -2px 15px rgba(255, 107, 157, 0.1);
}
.cart-left { display: flex; align-items: center; }
.cart-icon { font-size: 26px; margin-right: 10px; position: relative; }
.cart-badge {
  position: absolute;
  top: -6px;
  right: -10px;
  background: #ff4081;
  color: #fff;
  font-size: 11px;
  min-width: 20px;
  height: 20px;
  border-radius: 10px;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 0 5px;
  box-shadow: 0 2px 6px rgba(255, 64, 129, 0.4);
}
.cart-total { color: #ff4081; font-weight: bold; font-size: 17px; }
.submit-btn {
  background: linear-gradient(135deg, #ff6b9d, #ff8fb3);
  color: #fff;
  padding: 12px 28px;
  border-radius: 25px;
  font-size: 14px;
  border: none;
  cursor: pointer;
  box-shadow: 0 4px 12px rgba(255, 107, 157, 0.35);
  transition: transform 0.15s;
}
.submit-btn:active { transform: scale(0.95); }
.submit-btn.disabled { background: #eee; color: #aaa; box-shadow: none; }

.modal-mask {
  position: fixed;
  top: 0; left: 0; right: 0; bottom: 0;
  background: rgba(0,0,0,0.5);
  z-index: 100;
  display: none;
}
.modal {
  position: fixed;
  bottom: 0;
  left: 0; right: 0;
  background: #fff;
  border-radius: 20px 20px 0 0;
  padding: 20px;
  z-index: 101;
  max-height: 70vh;
  display: none;
  flex-direction: column;
}
.modal-title {
  font-size: 18px;
  font-weight: bold;
  text-align: center;
  margin-bottom: 15px;
}
.modal-list { flex: 1; overflow-y: auto; }
.modal-item {
  display: flex;
  align-items: center;
  padding: 12px 0;
  border-bottom: 1px solid #fdf0f5;
}
.modal-emoji { font-size: 22px; margin-right: 12px; }
.modal-name { flex: 1; font-size: 14px; }
.modal-count { font-size: 13px; color: #999; margin-right: 12px; }
.modal-price { color: #ff4081; font-weight: bold; }
.modal-footer { display: flex; gap: 10px; margin-top: 15px; }
.modal-btn {
  flex: 1;
  padding: 12px;
  border-radius: 25px;
  font-size: 14px;
  border: none;
  cursor: pointer;
}
.btn-cancel { background: #fdf0f5; color: #666; }
.btn-confirm { background: linear-gradient(135deg, #ff6b9d, #ff8fb3); color: #fff; }
</style>
</head>
<body>

<div class="top-nav">
  <h1>🍬 零食小铺</h1>
  <p>选你喜欢的，他给你买～</p>
</div>

<div class="categories" id="categories"></div>
<div class="snack-list" id="snackList"></div>

<div class="bottom-bar">
  <div class="cart-left">
    <div class="cart-icon">
      🛒
      <div class="cart-badge" id="cartBadge" style="display:none">0</div>
    </div>
    <div class="cart-total" id="cartTotal">¥0.0</div>
  </div>
  <button class="submit-btn disabled" id="submitBtn" onclick="showConfirm()">选好了</button>
</div>

<div class="modal-mask" id="modalMask" onclick="hideModal()"></div>
<div class="modal" id="modal">
  <div class="modal-title" id="modalTitle">确认清单</div>
  <div class="modal-list" id="modalList"></div>
  <div class="modal-footer" id="modalFooter">
    <button class="modal-btn btn-cancel" onclick="hideModal()">再选选</button>
    <button class="modal-btn btn-confirm" onclick="submitOrder()">就这些啦</button>

  { id: 512, name: '豆乳蛋白卷', desc: '豆浆香味，酥脆夹心', price: 8, emoji: '🥛', cat: 6 },
  { id: 513, name: '青瓜茉莉椰子水', desc: '清爽解腻，低卡饮品', price: 10, emoji: '🥥', cat: 6 },
  { id: 514, name: '鲜奶脆', desc: '奶香味浓，健康小饼干', price: 9, emoji: '🍪', cat: 6 }

const categories = [
  { id: 1, name: '全部' },
  { id: 2, name: '膨化辣条' },
  { id: 3, name: '糖果巧克力' },
  { id: 4, name: '坚果果干' },
  { id: 5, name: '肉干肉脯' },
  { id: 6, name: '烘焙饮品' }
]

let activeCat = 1
let cart = {}

function renderCategories() {
  const el = document.getElementById('categories')
  el.innerHTML = categories.map(c => 
    `<div class="cat-tab ${activeCat === c.id ? 'active' : ''}" onclick="selectCat(${c.id})">${c.name}</div>`
  ).join('')
}

function selectCat(id) {
  activeCat = id
  renderCategories()
  renderSnacks()
}

function renderSnacks() {
  let list = activeCat === 1 ? snacks : snacks.filter(s => s.cat === activeCat)
  list = list.map(s => ({ ...s, count: cart[s.id] || 0 }))
  
  const el = document.getElementById('snackList')
  el.innerHTML = list.map(s => `
    <div class="snack-item">
      <div class="snack-emoji">${s.emoji}</div>
      <div class="snack-info">
        <div class="snack-name">${s.name}</div>
        <div class="snack-desc">${s.desc}</div>
        <div class="snack-price">¥${s.price}</div>
      </div>
      <div class="snack-actions">
        ${s.count > 0 ? `<div class="minus-btn" onclick="decrease(${s.id})">−</div>` : ''}
        ${s.count > 0 ? `<div class="count">${s.count}</div>` : ''}
        <div class="plus-btn" onclick="increase(${s.id})">＋</div>
      </div>
    </div>
  `).join('')
  
  updateCart()
}

function increase(id) {
  cart[id] = (cart[id] || 0) + 1
  renderSnacks()
}

function decrease(id) {
  cart[id] = (cart[id] || 0) - 1
  if (cart[id] <= 0) delete cart[id]
  renderSnacks()
}

function updateCart() {
  let count = 0, total = 0
  Object.keys(cart).forEach(id => {
    const snack = snacks.find(s => s.id == id)
    if (snack) {
      count += cart[id]
      total += snack.price * cart[id]
    }
  })
  
  document.getElementById('cartBadge').style.display = count > 0 ? 'flex' : 'none'
  document.getElementById('cartBadge').textContent = count
  document.getElementById('cartTotal').textContent = '¥' + total.toFixed(1)
  
  const btn = document.getElementById('submitBtn')
  if (count > 0) {
    btn.classList.remove('disabled')
  } else {
    btn.classList.add('disabled')
  }
}

function showConfirm() {
  let total = 0, count = 0
  const items = []
  
  Object.keys(cart).forEach(id => {
    const snack = snacks.find(s => s.id == id)
    if (snack) {
      items.push({ ...snack, count: cart[id] })
      total += snack.price * cart[id]
      count += cart[id]
    }
  })
  
  document.getElementById('modalList').innerHTML = items.map(item => `
    <div class="modal-item">
      <div class="modal-emoji">${item.emoji}</div>
      <div class="modal-name">${item.name}</div>
      <div class="modal-count">x${item.count}</div>
      <div class="modal-price">¥${(item.price * item.count).toFixed(1)}</div>
    </div>
  `).join('') + `<div style="text-align:right; padding:15px 0; font-weight:bold; color:#ff4081; font-size:16px;">合计：¥${total.toFixed(1)}</div>`
  
  document.getElementById('modalMask').style.display = 'block'
  document.getElementById('modal').style.display = 'flex'
}

function hideModal() {
  document.getElementById('modalMask').style.display = 'none'
  document.getElementById('modal').style.display = 'none'
}

// 生成分享链接
function submitOrder() {
  let total = 0
  const items = []
  
  Object.keys(cart).forEach(id => {
    const snack = snacks.find(s => s.id == id)
    if (snack) {
      items.push({ ...snack, count: cart[id] })
      total += snack.price * cart[id]
    }
  })
  
  const now = new Date()
  const timeStr = now.toLocaleString('zh-CN')
  
  const orderData = {
    time: timeStr,
    total: total.toFixed(1),
    items: items.map(i => ({ name: i.name, count: i.count, price: i.price, emoji: i.emoji }))
  }
  const encoded = btoa(encodeURIComponent(JSON.stringify(orderData)))
  // 正确生成管理端链接
  let basePath = window.location.pathname
  if (basePath.endsWith('index.html')) {
    basePath = basePath.replace('index.html', 'admin.html')
  } else if (basePath.endsWith('/')) {
    basePath = basePath + 'admin.html'
  }
  const shareUrl = `${window.location.origin}${basePath}?order=${encoded}`
  
  document.getElementById('modalTitle').textContent = '清单生成好啦！'
  document.getElementById('modalList').innerHTML = `
    <div style="text-align:center; padding: 20px 0;">
      <div style="font-size: 52px; margin-bottom: 15px;">🎁</div>
      <div style="font-size: 15px; color: #666; margin-bottom: 20px; line-height: 1.6;">
        点下面按钮复制链接，发给对方<br>他打开就能看到你选的零食啦
      </div>
      <button onclick="copyShareLink('${shareUrl}')" style="background: linear-gradient(135deg, #ff6b9d, #ff8fb3); color: #fff; border: none; padding: 12px 35px; border-radius: 25px; font-size: 15px; cursor: pointer; box-shadow: 0 4px 12px rgba(255, 107, 157, 0.35);">
        复制链接发给他
      </button>
    </div>
  `
  document.getElementById('modalFooter').style.display = 'none'
  
  cart = {}
  renderSnacks()
}

function copyShareLink(url) {
  navigator.clipboard.writeText(url).then(() => {
    alert('链接已复制，快发给他吧～')
    hideModal()
    document.getElementById('modalFooter').style.display = 'flex'
    document.getElementById('modalTitle').textContent = '确认清单'
  })
}

renderCategories()
renderSnacks()
</script>
</body>
</html>
