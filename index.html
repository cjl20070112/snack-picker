<style>

.plus-btn, .minus-btn {

.bottom-bar {

.modal-mask {

  display: none;

.loading {

const categories = [
  { id: 1, name: '全部' },
  { id: 2, name: '膨化食品' },
  { id: 3, name: '糖果巧克力' },
  { id: 4, name: '坚果炒货' },
  { id: 5, name: '肉干肉脯' },
  { id: 6, name: '饼干饮品' }
]

let activeCat = 1
let cart = {}

function switchPage(page, el) {
  document.querySelectorAll('.page').forEach(p => p.classList.remove('active'))
  document.querySelectorAll('.nav-tab').forEach(t => t.classList.remove('active'))
  document.getElementById('page-' + page).classList.add('active')
  el.classList.add('active')
  
  if (page === 'admin') {
    loadOrders()
  }
}

function renderCategories() {
  const el = document.getElementById('categories')
  el.innerHTML = categories.map(c => 
    `<div class="cat-tab ${activeCat === c.id ? 'active' : ''}" onclick="selectCat(${c.id})">${c.name}</div>`
  ).join('')
}

function selectCat(id) {
  activeCat = id
  renderCategories()
  renderSnacks()
}

function renderSnacks() {
  let list = activeCat === 1 ? snacks : snacks.filter(s => s.cat === activeCat)
  list = list.map(s => ({ ...s, count: cart[s.id] || 0 }))
  
  const el = document.getElementById('snackList')
  el.innerHTML = list.map(s => `
    <div class="snack-item">
      <div class="snack-emoji">${s.emoji}</div>
      <div class="snack-info">
        <div class="snack-name">${s.name}</div>
        <div class="snack-desc">${s.desc}</div>
        <div class="snack-price">¥${s.price}</div>
      </div>
      <div class="snack-actions">
        ${s.count > 0 ? `<div class="minus-btn" onclick="decrease(${s.id})">−</div>` : ''}
        ${s.count > 0 ? `<div class="count">${s.count}</div>` : ''}
        <div class="plus-btn" onclick="increase(${s.id})">＋</div>
      </div>
    </div>
  `).join('')
  
  updateCart()
}

function increase(id) {
  cart[id] = (cart[id] || 0) + 1
  renderSnacks()
}

function decrease(id) {
  cart[id] = (cart[id] || 0) - 1
  if (cart[id] <= 0) delete cart[id]
  renderSnacks()
}

function updateCart() {
  let count = 0, total = 0
  Object.keys(cart).forEach(id => {
    const snack = snacks.find(s => s.id == id)
    if (snack) {
      count += cart[id]
      total += snack.price * cart[id]
    }
  })
  
  document.getElementById('cartBadge').style.display = count > 0 ? 'flex' : 'none'
  document.getElementById('cartBadge').textContent = count
  document.getElementById('cartTotal').textContent = '¥' + total.toFixed(1)
  
  const btn = document.getElementById('submitBtn')
  if (count > 0) {
    btn.classList.remove('disabled')
  } else {
    btn.classList.add('disabled')
  }
}

function showConfirm() {
  let total = 0, count = 0
  const items = []
  
  Object.keys(cart).forEach(id => {
    const snack = snacks.find(s => s.id == id)
    if (snack) {
      items.push({ ...snack, count: cart[id] })
      total += snack.price * cart[id]
      count += cart[id]
    }
  })
  
  document.getElementById('modalList').innerHTML = items.map(item => `
    <div class="modal-item">
      <div class="modal-emoji">${item.emoji}</div>
      <div class="modal-name">${item.name}</div>
      <div class="modal-count">x${item.count}</div>
      <div class="modal-price">¥${(item.price * item.count).toFixed(1)}</div>
    </div>
  `).join('') + `<div style="text-align:right; padding:12px 0; font-weight:bold; color:#ff4081">合计：¥${total.toFixed(1)}</div>`
  
  document.getElementById('modalMask').style.display = 'block'
  document.getElementById('modal').style.display = 'flex'
}

function hideModal() {
  document.getElementById('modalMask').style.display = 'none'
  document.getElementById('modal').style.display = 'none'
}

// 生成分享链接
function submitOrder() {
  let total = 0
  const items = []
  
  Object.keys(cart).forEach(id => {
    const snack = snacks.find(s => s.id == id)
    if (snack) {
      items.push({ ...snack, count: cart[id] })
      total += snack.price * cart[id]
    }
  })
  
  const now = new Date()
  const timeStr = now.toLocaleString('zh-CN')
  
  // 把订单数据编码成 URL
  const orderData = {
    time: timeStr,
    total: total.toFixed(1),
    items: items.map(i => ({ name: i.name, count: i.count, price: i.price, emoji: i.emoji }))
  }
  const encoded = btoa(encodeURIComponent(JSON.stringify(orderData)))
  const shareUrl = `${window.location.origin}${window.location.pathname}?order=${encoded}`
  
  // 显示分享弹窗
  document.querySelector('.modal-title').textContent = '订单已生成！'
  document.getElementById('modalList').innerHTML = `
    <div style="text-align:center; padding: 20px 0;">
      <div style="font-size: 48px; margin-bottom: 15px;">🎁</div>
      <div style="font-size: 15px; color: #666; margin-bottom: 20px;">
        把下面这个链接发给对方，他打开就能看到你选的零食啦
      </div>
      <div style="background: #f5f5f5; padding: 12px; border-radius: 8px; word-break: break-all; font-size: 12px; color: #333; margin-bottom: 15px;">
        ${shareUrl}
      </div>
      <button onclick="copyShareLink('${shareUrl}')" style="background: #ff6b9d; color: #fff; border: none; padding: 10px 30px; border-radius: 20px; font-size: 14px; cursor: pointer;">
        复制链接
      </button>
    </div>
  `
  document.querySelector('.modal-footer').style.display = 'none'
  
  // 保存订单到本地
  const orders = JSON.parse(localStorage.getItem('orders') || '[]')
  orders.unshift(orderData)
  localStorage.setItem('orders', JSON.stringify(orders))
  
  cart = {}
  renderSnacks()
}

function copyShareLink(url) {
  navigator.clipboard.writeText(url).then(() => {
    alert('链接已复制，快发给对方吧～')
    hideModal()
    document.querySelector('.modal-footer').style.display = 'flex'
    document.querySelector('.modal-title').textContent = '确认订单'
  })
}

// 从本地加载订单列表
function loadOrders() {
  document.getElementById('adminLoading').style.display = 'none'
  
  const orders = JSON.parse(localStorage.getItem('orders') || '[]')
  
  if (orders.length === 0) {
    document.getElementById('orderList').innerHTML = `<div class="empty">
      <div class="empty-icon">📦</div>
      <div>还没有订单哦</div>
      <div style="font-size: 12px; margin-top: 10px; color: #bbb;">她选完后把链接发给你，你打开就能看到啦</div>
    </div>`
    return
  }
  
  document.getElementById('orderList').innerHTML = orders.map(order => `
    <div class="order-card">
      <div class="order-header">
        <div class="order-time">${order.time}</div>
        <div class="order-status">待配送</div>
      </div>
      <div class="order-items">
        ${order.items.map(item => `
          <div class="order-item">
            <span>${item.emoji} ${item.name} x${item.count}</span>
            <span>¥${(item.price * item.count).toFixed(1)}</span>
          </div>
        `).join('')}
      </div>
      <div class="order-footer">
        <span>合计</span>
        <span class="order-total">¥${order.total}</span>
      </div>
    </div>
  `).join('')
}

// 初始化
renderCategories()
renderSnacks()

// 如果 URL 里有订单参数，自动显示并保存
function checkUrlOrder() {
  const params = new URLSearchParams(window.location.search)
  const orderStr = params.get('order')
  if (orderStr) {
    try {
      const order = JSON.parse(decodeURIComponent(atob(orderStr)))
      // 保存到本地
      const orders = JSON.parse(localStorage.getItem('orders') || '[]')
      // 避免重复保存
      const exists = orders.some(o => o.time === order.time)
      if (!exists) {
        orders.unshift(order)
        localStorage.setItem('orders', JSON.stringify(orders))
      }
      // 显示在管理后台
      switchPage('admin', document.querySelectorAll('.nav-tab')[1])
      setTimeout(() => {
        alert('收到新订单！🎉')
      }, 300)
    } catch(e) {
      console.error(e)
    }
  }
}
checkUrlOrder()
