<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>订单管理 - 零食小铺</title>
<script src="https://imgcache.qq.com/qcloud/cloudbase-js-sdk/2.7.6/cloudbase.full.js"></script>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  background: #fdf2f6;
  padding-bottom: 40px;
}

.top-nav {
  background: linear-gradient(135deg, #ff8fb3, #ffa8c5);
  color: #fff;
  padding: 20px;
  box-shadow: 0 2px 10px rgba(255, 107, 157, 0.2);
}
.top-nav h1 { font-size: 20px; font-weight: bold; }
.top-nav p { font-size: 13px; opacity: 0.9; margin-top: 4px; }

.section-title {
  font-size: 14px;
  font-weight: bold;
  color: #666;
  margin: 20px 0 12px 5px;
}

.order-list { padding: 0 15px; }
.order-card {
  background: #fff;
  border-radius: 16px;
  padding: 18px;
  margin-bottom: 14px;
  box-shadow: 0 2px 10px rgba(255, 107, 157, 0.08);
}
.order-card.latest {
  border: 2px solid #ff8fb3;
  box-shadow: 0 4px 15px rgba(255, 107, 157, 0.15);
}
.order-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding-bottom: 12px;
  border-bottom: 1px solid #fdf0f5;
  margin-bottom: 12px;
}
.order-user { font-size: 14px; font-weight: bold; color: #333; }
.order-time { font-size: 12px; color: #999; margin-top: 3px; }
.order-actions { display: flex; gap: 8px; align-items: center; }
.order-status {
  font-size: 12px;
  padding: 4px 12px;
  border-radius: 12px;
  background: #fff3e8;
  color: #ff6700;
  cursor: pointer;
}
.order-status.done {
  background: #e8f5e9;
  color: #4caf50;
}
.delete-btn {
  font-size: 12px;
  padding: 4px 10px;
  border-radius: 12px;
  background: #ffebee;
  color: #f44336;
  border: none;
  cursor: pointer;
}
.order-items { margin-bottom: 12px; }
.order-item {
  display: flex;
  justify-content: space-between;
  padding: 6px 0;
  font-size: 14px;
  color: #555;
}
.order-footer {
  display: flex;
  justify-content: space-between;
  padding-top: 12px;
  border-top: 1px solid #fdf0f5;
  font-weight: bold;
}
.order-total { color: #ff4081; }

.empty {
  text-align: center;
  padding: 80px 20px;
  color: #999;
}
.empty-icon { font-size: 60px; margin-bottom: 15px; }

.loading {
  text-align: center;
  padding: 60px 0;
  color: #999;
}

.back-link {
  display: block;
  text-align: center;
  margin-top: 30px;
  font-size: 13px;
  color: #ff6b9d;
  text-decoration: none;
}
</style>
</head>
<body>

<div class="top-nav">
  <h1>📦 订单管理</h1>
  <p>她选的零食都在这里啦</p>
</div>

<div class="loading" id="loading">加载中...</div>
<div class="order-list" id="orderList" style="display:none"></div>

<a class="back-link" href="index.html">← 去选零食</a>

<script>
// 初始化 CloudBase
const app = cloudbase.init({
  env: 'snack-d8g93zkjucee67b7e'
})
const auth = app.auth()
const db = app.database()

async function loadOrders() {
  try {
    // 匿名登录
    await auth.signInAnonymously()
    
    // 从数据库拉取订单，按时间倒序
    const res = await db.collection('orders')
      .orderBy('createTime', 'desc')
      .limit(50)
      .get()
    
    document.getElementById('loading').style.display = 'none'
    document.getElementById('orderList').style.display = 'block'
    
    const orders = res.data
    
    if (orders.length === 0) {
      document.getElementById('orderList').innerHTML = `<div class="empty">
        <div class="empty-icon">📭</div>
        <div>还没有订单哦</div>
        <div style="font-size: 12px; margin-top: 10px; color: #bbb;">她在那边选完提交，这里马上就能看到</div>
      </div>`
      return
    }
    
    // 最新订单是第一个
    const latest = orders[0]
    // 历史订单是剩下的
    const history = orders.slice(1)
    
    let html = `
      <div class="section-title">🌟 最新订单</div>
      <div class="order-card latest">
        <div class="order-header">
          <div>
            <div class="order-user">👤 ${latest.userName}</div>
            <div class="order-time">${formatTime(latest.createTime)}</div>
          </div>
          <div class="order-actions">
            <div class="order-status" onclick="toggleDone('${latest._id}')">待买</div>
            <button class="delete-btn" onclick="deleteOrder('${latest._id}')">删除</button>
          </div>
        </div>
        <div class="order-items">
          ${latest.items.map(item => `
            <div class="order-item">
              <span>${item.emoji} ${item.name} x${item.count}</span>
              <span>¥${(item.price * item.count).toFixed(1)}</span>
            </div>
          `).join('')}
        </div>
        <div class="order-footer">
          <span>合计</span>
          <span class="order-total">¥${latest.total}</span>
        </div>
      </div>
    `
    
    if (history.length > 0) {
      html += `<div class="section-title">📚 历史订单（${history.length}个）</div>`
      history.forEach(order => {
        html += `
          <div class="order-card">
            <div class="order-header">
              <div>
                <div class="order-user">👤 ${order.userName}</div>
                <div class="order-time">${formatTime(order.createTime)}</div>
              </div>
              <div class="order-actions">
                <div class="order-status" onclick="toggleDone('${order._id}')">待买</div>
                <button class="delete-btn" onclick="deleteOrder('${order._id}')">删除</button>
              </div>
            </div>
            <div class="order-items">
              ${order.items.map(item => `
                <div class="order-item">
                  <span>${item.emoji} ${item.name} x${item.count}</span>
                  <span>¥${(item.price * item.count).toFixed(1)}</span>
                </div>
              `).join('')}
            </div>
            <div class="order-footer">
              <span>合计</span>
              <span class="order-total">¥${order.total}</span>
            </div>
          </div>
        `
      })
    }
    
    document.getElementById('orderList').innerHTML = html
    
  } catch(e) {
    console.error('加载失败:', e)
    document.getElementById('loading').style.display = 'none'
    document.getElementById('orderList').style.display = 'block'
    document.getElementById('orderList').innerHTML = `<div class="empty">
      <div class="empty-icon">❌</div>
      <div>加载失败，请检查网络</div>
    </div>`
  }
}

function formatTime(date) {
  if (!date) return ''
  const d = new Date(date)
  return d.toLocaleString('zh-CN')
}

async function toggleDone(id) {
  // 简单的状态切换，先不做复杂的
  alert('这个功能后面再加')
}

async function deleteOrder(id) {
  if (!confirm('确定删除这个订单吗？')) return
  try {
    await db.collection('orders').doc(id).remove()
    loadOrders()
  } catch(e) {
    alert('删除失败')
  }
}

// 自动刷新，10秒刷一次
setInterval(() => {
  if (!document.hidden) {
    loadOrders()
  }
}, 10000)

loadOrders()
</script>
</body>
</html>
